<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
    <p class="prose" th:if="${album.album.description != null}" th:text="${album.album.description}">Description</p>
    <p class="gallery-meta">
        <th:block th:text="${album.photos.size() == 1} ? '1 photo' : ${album.photos.size() + ' photos'}">12 photos</th:block>.
        Select a photo to view it larger. <a th:href="@{/gallery}">All albums</a>
    </p>
    <ul class="photo-grid">
        <li th:each="p : ${album.photos}">
            <a class="photo-card" th:href="@{${album.path + '/' + p.id}}">
                <span class="photo-card__media">
                    <img th:src="@{${p.thumbUrl}}" th:alt="${p.alt(album.album.title, album.photos.size())}"
                         loading="lazy" width="640" height="480">
                </span>
                <span class="photo-card__caption" th:if="${p.caption != null}" th:text="${p.caption}" aria-hidden="true">Caption</span>
            </a>
        </li>
    </ul>
</th:block>
</body>
</html>
