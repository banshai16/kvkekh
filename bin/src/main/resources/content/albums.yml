# Photo gallery. Each album shows every JPG/PNG in its folder (media-relative), sorted by file name.
# To add photos: copy them into the folder — they appear without a restart.
# To add an album: add a folder under images/photogallery and an entry here.
#
#   slug      URL part: /gallery/<slug>      cover   file name of the cover photo (default: first)
#   captions  per-file text, also used as the image's alternative text (GIGW/WCAG 1.1.1). Files without
#             one get a caption from their file name when it is descriptive ("Field preparation for SRI"),
#             otherwise "<Album>, photo N of M". Captions below describe only what is visible in the photo;
#             KVK staff should add names, places and dates where known.
