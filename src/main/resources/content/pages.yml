# Content registry: the single source for routes, page titles, breadcrumbs, the sitemap,
# search and 301 redirects from the legacy PHP URLs.
#
#   id            stable key referenced from navigation / footer / parent
#   path          new URL (relative to the context path)
#   title         <h1>, <title>, menu label, breadcrumb
#   description   one sentence; used for <meta name="description"> and search results
#   template      Thymeleaf template; omit while the page is still awaiting migration
#   parent        page id used for breadcrumbs when the page is not in the global navigation
#   last-updated  shown in the footer as "Last Updated On" (DBIM 5.6). Content carried over unchanged
#                 from the legacy site keeps that site's last stated update, 11 February 2020.
#   legacy        old PHP paths that 301-redirect here (album pages are listed in albums.yml)
content:
  pages:
    # --- Home ---------------------------------------------------------------------------------
    - id: home
      path: /
      title: "Home"
      description: "Krishi Vigyan Kendra, East Khasi Hills — farm science centre of the Department of Agriculture and Farmers' Welfare, Government of Meghalaya."
      template: pages/home
      last-updated: 2026-10-16
      legacy: [/index.php]

