# Downloadable documents and notices. Paths are relative to media.root.
# File type and size are read from disk at startup; a missing file is logged and shown without a link.
#
#   title  link text (describe the document, not "click here")
#   file   media-relative path to the document   — or —   link: a page path on this site
#   lang   BCP 47 code when the document is not in English (kha = Khasi)
#   date   optional free-text date or period shown after the title
#   archived  date the item was moved to the archive. Archived items leave their list and appear on the
#             Archive page (GIGW: outdated content is archived with its archival date, not deleted).
